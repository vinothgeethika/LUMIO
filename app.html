    <script id="lumio-attribution-script">
        (function() {
            var PAGE_TITLE = "LUMIO — 3D Device Mockup & Video Promo Studio | Developed by Vinoth Geethika";
            
            function enforceTitle() {
                if (document.title !== PAGE_TITLE) {
                    document.title = PAGE_TITLE;
                }
            }

            function injectAttribution() {
                enforceTitle();

                // 1. Inject Developer Badge next to LUMIO Header Brand
                var logoNodes = document.querySelectorAll('header a, nav a, .header-logo, a[href="/"], a[href="/app"]');
                for (var i = 0; i < logoNodes.length; i++) {
                    var el = logoNodes[i];
                    if (el.textContent && el.textContent.includes('LUMIO') && !el.querySelector('.lumio-dev-badge') && !el.nextElementSibling?.classList?.contains('lumio-dev-badge')) {
                        var badge = document.createElement('span');
                        badge.className = 'lumio-dev-badge';
                        badge.innerHTML = '<span class="lumio-dev-dot"></span>by Vinoth Geethika';
                        badge.title = 'Developed & Engineered by Vinoth Geethika';
                        if (el.parentElement) {
                            el.parentElement.style.display = el.parentElement.style.display || 'flex';
                            el.parentElement.style.alignItems = 'center';
                        }
                        el.appendChild(badge);
                        break;
                    }
                }

                // 2. Inject sleek Footer Credit if not already present
                if (!document.getElementById('lumio-footer-credit-el')) {
                    var footer = document.querySelector('footer');
                    var credit = document.createElement('div');
                    credit.id = 'lumio-footer-credit-el';
                    credit.className = 'lumio-footer-credit';
                    credit.innerHTML = 'LUMIO Studio • Designed & Engineered with precision by <strong>Vinoth Geethika</strong>';
                    
                    if (footer) {
                        footer.appendChild(credit);
                    } else {
                        var appRoot = document.getElementById('__next') || document.body;
                        if (appRoot && appRoot.lastElementChild && !document.getElementById('lumio-footer-credit-el')) {
                            // Only append if at page bottom
                            var host = document.querySelector('.main-content, main, #__next');
                            if (host) host.appendChild(credit);
                        }
                    }
                }
            }

            document.addEventListener('DOMContentLoaded', injectAttribution);
            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                injectAttribution();
            }

            // Observe DOM mutations to persist badge across client-side router navigation
            var observer = new MutationObserver(function() {
                injectAttribution();
            });
            observer.observe(document.documentElement, { childList: true, subtree: true });
        })();
    </script>

        (function() {
            // Transparent GLB fetch fallback to production CDN if missing locally
            var _origFetch = window.fetch;
            window.fetch = async function(input, init) {
                var url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
                try {
                    var res = await _origFetch.apply(this, arguments);
                    if (!res.ok && url.includes('.glb')) {
                        var filename = url.split('/').pop().split('?')[0];
                        var sub = url.includes('ComputerAnimations') ? 'ComputerAnimations/' : (url.includes('phones') ? 'phones/' : (url.includes('computers') ? 'computers/' : ''));
                        var fallbackUrl = 'https://www.promogen.app/' + sub + filename;
                        return _origFetch(fallbackUrl, init);
                    }
                    return res;
                } catch(err) {
                    if (url.includes('.glb')) {
                        var filename = url.split('/').pop().split('?')[0];
                        var sub = url.includes('ComputerAnimations') ? 'ComputerAnimations/' : (url.includes('phones') ? 'phones/' : (url.includes('computers') ? 'computers/' : ''));
                        return _origFetch('https://www.promogen.app/' + sub + filename, init);
                    }
                    throw err;
                }
            };
        })();
